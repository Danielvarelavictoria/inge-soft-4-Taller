# Node 2 - E-Commerce Server (Backend Core)
Node2Adapter.Endpoints=default -h localhost -p 10005
Ice.ThreadPool.Server.Size=8
Ice.ThreadPool.Server.SizeMax=64

# Required socket: persistirTransaccionPostgres (Node 4)
ApexStore.Persistence.Proxy=Persistence:default -h localhost -p 10004

# Available payment strategies (Node 3). To add a new payment method, add it to
# this list and declare its proxy: the context is not modified (RAS-04).
ApexStore.Strategies=stripe,pse,crypto
ApexStore.Strategy.stripe=Stripe:default -h localhost -p 10006
ApexStore.Strategy.pse=PSE:default -h localhost -p 10006
ApexStore.Strategy.crypto=Crypto:default -h localhost -p 10006

# Fault tolerance
ApexStore.GatewayInvocationTimeoutMs=2000
ApexStore.CallbackTimeoutMs=5000
ApexStore.Breaker.Threshold=3
ApexStore.Breaker.CooldownMs=10000
